name: Build MovieBox.exe
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      # Always-available download link: Releases -> "latest" -> MovieBox.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MovieBox (latest build)
          files: dist/MovieBox.exe
