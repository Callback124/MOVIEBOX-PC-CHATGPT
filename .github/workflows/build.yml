name: Build MovieBox Windows EXE
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm install --no-save hls.js@latest
      - run: node scripts/copy-hls.js node_modules/hls.js/dist/hls.min.js renderer/hls.min.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: MovieBox-exe, path: dist/MovieBox.exe }


  release:
    needs: [exe]
    # publish the exe even if the apk job fails, so one broken part never blocks the other
    if: ${{ !cancelled() && needs.exe.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MovieBox (latest build)
          files: |
            out/MovieBox.exe
