name: Build Native Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [ moviebox-tmdb ]
    paths:
      - 'android-tv/**'
      - '.github/workflows/native-tv.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare MovieBox launcher icon
        run: |
          mkdir -p android-tv/native-app/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 'https://m.media-amazon.com/images/I/412DqGqoiGL.png' -o /tmp/moviebox-source-icon.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/moviebox-source-icon.png').convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (0, 0, 0, 255))
          src.thumbnail((492, 300), Image.Resampling.LANCZOS)
          canvas.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          canvas.convert('RGB').save('android-tv/native-app/app/src/main/res/drawable-nodpi/moviebox_logo_icon.png', quality=95)
          PY
      - name: Build debug APK
        working-directory: android-tv/native-app
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Native-TV-apk
          path: android-tv/native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
