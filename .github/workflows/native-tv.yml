name: Build Native Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [ moviebox-tmdb ]
    paths:
      - 'android-tv/**'
      - '.github/workflows/native-tv.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare MovieBox launcher icon
        run: |
          mkdir -p android-tv/native-app/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 'https://m.media-amazon.com/images/I/412DqGqoiGL.png' -o /tmp/moviebox-source-icon.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/moviebox-source-icon.png').convert('RGBA')
          canvas = Image.new('RGBA', (512, 512), (0, 0, 0, 255))
          src.thumbnail((492, 300), Image.Resampling.LANCZOS)
          canvas.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          canvas.convert('RGB').save('android-tv/native-app/app/src/main/res/drawable-nodpi/moviebox_logo_icon.png', quality=95)
          PY
      - name: Prepare Android TV landscape banner
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          src = Image.open('/tmp/moviebox-source-icon.png').convert('RGBA')
          # Android TV banner is a wide 16:9 canvas; preserve the logo proportions.
          W, H = 1280, 720
          canvas = Image.new('RGB', (W, H), (8, 8, 14))
          # Subtle dark gradient for a clean TV launcher tile.
          px = canvas.load()
          for y in range(H):
              shade = int(8 + 8 * (1 - abs(y - H/2) / (H/2)))
              for x in range(W):
                  px[x, y] = (shade, shade, min(24, shade + 10))
          # Keep the original supplied logo centered, without stretching or cropping.
          src.thumbnail((900, 500), Image.Resampling.LANCZOS)
          x = (W - src.width) // 2
          y = (H - src.height) // 2
          canvas_rgba = canvas.convert('RGBA')
          canvas_rgba.alpha_composite(src, (x, y))
          canvas_rgba.convert('RGB').save(
              'android-tv/native-app/app/src/main/res/drawable-nodpi/tv_banner.png',
              quality=95
          )
          PY
      - name: Build debug APK
        working-directory: android-tv/native-app
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Native-TV-apk
          path: android-tv/native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
