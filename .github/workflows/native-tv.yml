name: Build Native Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [moviebox-tmdb]
    paths:
      - 'android-tv/native-app/**'
      - 'android-tv/native/**'
      - '.github/workflows/native-tv.yml'
permissions:
  contents: read
jobs:
  native-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone native TV APK
        working-directory: android-tv/native-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Native-TV-apk
          path: android-tv/native-app/app/build/outputs/apk/debug/app-debug.apk
